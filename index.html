<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cielo en Vivo - Constelaciones</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  #canvas-container {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
  }

  #ui {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0, 0, 30, 0.92);
    border-top: 2px solid #4a90e2;
    padding: 10px 15px;
    z-index: 10;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: nowrap;
  }

  #ui h2 {
    font-size: 14px;
    color: #4a90e2;
    margin: 0;
    white-space: nowrap;
  }

  #location-status {
    background: #111;
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 12px;
    border-left: 3px solid #4a90e2;
    white-space: nowrap;
    min-width: 150px;
  }
  #location-status.loading { border-left-color: #f39c12; }
  #location-status.success { border-left-color: #2ecc71; }
  #location-status.error { border-left-color: #e74c3c; }

  .buttons-group {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  button {
    background: #4a90e2;
    color: #fff;
    border: none;
    padding: 8px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  button:hover { background: #357abd; }
  button.equator {
    background: #2ecc71;
    font-weight: bold;
  }
  button.equator:hover { background: #27ae60; }
  button.equator.active {
    background: #f39c12;
  }

  #time-control {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  #time-control label {
    font-size: 12px;
    color: #aaa;
    white-space: nowrap;
  }
  #time-slider {
    width: 120px;
  }
  #time-display {
    font-size: 13px;
    color: #4a90e2;
    min-width: 45px;
    text-align: center;
  }
  #btn-now {
    padding: 6px 10px;
    font-size: 12px;
  }

  #info {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 30, 0.75);
    padding: 8px 15px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 10;
    border: 1px solid #4a90e2;
    text-align: center;
  }

  @media (max-width: 900px) {
    #ui {
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    #location-status {
      min-width: auto;
    }
    .buttons-group {
      width: 100%;
      justify-content: center;
    }
    #time-control {
      width: 100%;
      justify-content: center;
    }
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="info">
  <div id="constellation-info">Toca una estrella para ver su nombre</div>
</div>

<div id="ui">
  <div>
    <h2>🌌 Cielo en Vivo</h2>
    <div id="location-status" class="loading">📡 Obteniendo...</div>
  </div>

  <div class="buttons-group">
    <button id="btn-equator" class="equator">🌐 Ecuador (todas)</button>
    <button id="btn-mylocation">📍 Mi ubicación</button>
  </div>

  <div id="time-control">
    <label>Hora:</label>
    <input type="range" id="time-slider" min="0" max="24" step="0.1" value="22">
    <div id="time-display">22:00</div>
    <button id="btn-now">⏱️ Ahora</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============ CONFIGURACIÓN 3D ============
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('canvas-container').appendChild(renderer.domElement);
camera.position.set(0, 0, 0.1);

// ============ TEXTURA DE BRILLO PARA ESTRELLAS ============
function createGlowTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 64;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
  gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.8)');
  gradient.addColorStop(0.5, 'rgba(200, 220, 255, 0.3)');
  gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 64, 64);
  const texture = new THREE.CanvasTexture(canvas);
  return texture;
}

const glowTexture = createGlowTexture();

// ============ ESTRELLAS BRILLANTES ============
const brightStars = [
  ["Sirio", 6.75, -16.72, -1.46],
  ["Canopo", 6.40, -52.70, -0.74],
  ["Arturo", 14.26, 19.18, -0.05],
  ["Vega", 18.62, 38.78, 0.03],
  ["Capella", 5.28, 46.00, 0.08],
  ["Rigel", 5.24, -8.20, 0.13],
  ["Proción", 7.65, 5.22, 0.34],
  ["Betelgeuse", 5.92, 7.41, 0.42],
  ["Achernar", 1.63, -57.24, 0.46],
  ["Hadar", 14.06, -60.37, 0.61],
  ["Altair", 19.85, 8.87, 0.77],
  ["Aldebarán", 4.60, 16.51, 0.85],
  ["Antares", 16.49, -26.43, 0.96],
  ["Espiga", 13.42, -11.16, 0.97],
  ["Pólux", 7.76, 28.03, 1.14],
  ["Fomalhaut", 22.96, -29.62, 1.16],
  ["Deneb", 20.69, 45.28, 1.25],
  ["Mimosa", 12.80, -59.69, 1.25],
  ["Regulus", 10.14, 11.97, 1.35],
  ["Adhara", 6.98, -28.97, 1.50],
  ["Shaula", 17.56, -37.10, 1.63],
  ["Castor", 7.58, 31.89, 1.58],
  ["Bellatrix", 5.42, 6.35, 1.64],
  ["Elnath", 5.03, 28.61, 1.65],
  ["Miaplacidus", 9.22, -69.72, 1.68]
];

// ============ CONSTELACIONES ============
const constellations = {
  "Orión": { stars: [5, 7, 22], lines: [[5, 7], [7, 22], [5, 22]] },
  "Cruz del Sur": { stars: [17, 9], lines: [[17, 9]] },
  "Escorpio": { stars: [12, 20], lines: [[12, 20]] },
  "Can Mayor": { stars: [0, 6, 19], lines: [[0, 6], [6, 19]] }
};

// ============ FUNCIÓN: Coordenadas celestes a 3D ============
function raDecToXYZ(raHours, decDeg, radius) {
  const ra = (raHours / 24) * Math.PI * 2;
  const dec = (decDeg / 180) * Math.PI;
  const x = radius * Math.cos(dec) * Math.cos(ra);
  const y = radius * Math.sin(dec);
  const z = -radius * Math.cos(dec) * Math.sin(ra);
  return new THREE.Vector3(x, y, z);
}

// ============ FONDO DE ESTRELLAS PEQUEÑAS ============
const starGeometry = new THREE.BufferGeometry();
const starPositions = [];
for (let i = 0; i < 4000; i++) {
  const ra = Math.random() * 24;
  const dec = (Math.random() * 180) - 90;
  const pos = raDecToXYZ(ra, dec, 300);
  starPositions.push(pos.x, pos.y, pos.z);
}
starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
const starMaterial = new THREE.PointsMaterial({ 
  color: 0xffffff, 
  size: 1.5,
  sizeAttenuation: true
});
scene.add(new THREE.Points(starGeometry, starMaterial));

// ============ ESTRELLAS BRILLANTES CON BRILLO ============
const starMeshes = [];
brightStars.forEach((star, idx) => {
  const [name, ra, dec, mag] = star;
  const pos = raDecToXYZ(ra, dec, 300);
  
  // Tamaño basado en magnitud: más brillante = más grande
  const baseSize = Math.max(8, 25 - mag * 8);
  
  // Material con textura de brillo
  const material = new THREE.SpriteMaterial({
    map: glowTexture,
    color: mag < 0 ? 0xaaddff : (mag < 1 ? 0xffffff : 0xffeedd),
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  
  const sprite = new THREE.Sprite(material);
  sprite.position.copy(pos);
  sprite.scale.set(baseSize, baseSize, 1);
  sprite.userData = { name, constellation: findConstellation(idx) };
  scene.add(sprite);
  starMeshes.push(sprite);
});

function findConstellation(starIdx) {
  for (const [name, data] of Object.entries(constellations)) {
    if (data.stars.includes(starIdx)) return name;
  }
  return null;
}

// ============ LÍNEAS DE CONSTELACIONES ============
Object.values(constellations).forEach(c => {
  c.lines.forEach(([a, b]) => {
    const posA = raDecToXYZ(brightStars[a][1], brightStars[a][2], 300);
    const posB = raDecToXYZ(brightStars[b][1], brightStars[b][2], 300);
    const geometry = new THREE.BufferGeometry().setFromPoints([posA, posB]);
    const material = new THREE.LineBasicMaterial({ color: 0x4a90e2, opacity: 0.5, transparent: true });
    scene.add(new THREE.Line(geometry, material));
  });
});

// ============ VARIABLES DE UBICACIÓN Y HORA ============
let currentLat = 0;
let currentLon = 0;
let currentTime = 22;
let isEquatorMode = true;
let userLat = null;
let userLon = null;

// ============ ELEMENTOS DEL DOM ============
const locationStatus = document.getElementById('location-status');
const btnEquator = document.getElementById('btn-equator');
const btnMyLocation = document.getElementById('btn-mylocation');
const timeSlider = document.getElementById('time-slider');
const timeDisplay = document.getElementById('time-display');
const constellationInfo = document.getElementById('constellation-info');

// ============ DETECCIÓN AUTOMÁTICA DE UBICACIÓN ============
function detectLocation() {
  locationStatus.className = 'loading';
  locationStatus.textContent = '📡 Obteniendo...';
  
  if (!navigator.geolocation) {
    activateEquatorMode('❌ Sin soporte de ubicación');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (position) => {
      userLat = position.coords.latitude;
      userLon = position.coords.longitude;
      currentLat = userLat;
      currentLon = userLon;
      
      const latLabel = userLat >= 0 ? `${userLat.toFixed(2)}°N` : `${Math.abs(userLat).toFixed(2)}°S`;
      const lonLabel = userLon >= 0 ? `${userLon.toFixed(2)}°E` : `${Math.abs(userLon).toFixed(2)}°W`;
      
      locationStatus.className = 'success';
      locationStatus.innerHTML = `📍 ${latLabel}, ${lonLabel}`;
      
      isEquatorMode = false;
      btnEquator.classList.remove('active');
    },
    (error) => {
      let msg = '🌐 Ecuador (0°)';
      if (error.code === 1) msg = '🌐 Permiso denegado';
      else if (error.code === 2) msg = '🌐 Ubicación no disponible';
      else if (error.code === 3) msg = '🌐 Tiempo agotado';
      
      activateEquatorMode(msg);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function activateEquatorMode(message) {
  currentLat = 0;
  currentLon = 0;
  isEquatorMode = true;
  
  locationStatus.className = 'success';
  locationStatus.innerHTML = message;
  
  btnEquator.classList.add('active');
}

btnEquator.addEventListener('click', () => {
  activateEquatorMode('🌐 Ecuador (0°)');
});

btnMyLocation.addEventListener('click', () => {
  if (userLat !== null) {
    currentLat = userLat;
    currentLon = userLon;
    isEquatorMode = false;
    
    const latLabel = userLat >= 0 ? `${userLat.toFixed(2)}°N` : `${Math.abs(userLat).toFixed(2)}°S`;
    const lonLabel = userLon >= 0 ? `${userLon.toFixed(2)}°E` : `${Math.abs(userLon).toFixed(2)}°W`;
    
    locationStatus.className = 'success';
    locationStatus.innerHTML = `📍 ${latLabel}, ${lonLabel}`;
    
    btnEquator.classList.remove('active');
  } else {
    detectLocation();
  }
});

timeSlider.addEventListener('input', (e) => {
  currentTime = parseFloat(e.target.value);
  updateTimeDisplay();
});

document.getElementById('btn-now').addEventListener('click', () => {
  const now = new Date();
  currentTime = now.getHours() + now.getMinutes()/60;
  timeSlider.value = currentTime;
  updateTimeDisplay();
});

function updateTimeDisplay() {
  const h = Math.floor(currentTime);
  const m = Math.floor((currentTime - h) * 60);
  timeDisplay.textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
}

function updateSkyRotation() {
  const hourAngle = (currentTime / 24) * Math.PI * 2;
  scene.rotation.y = -hourAngle;
  scene.rotation.x = (currentLat / 180) * Math.PI;
}

// ============ INTERACTIVIDAD ============
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(starMeshes);
  if (intersects.length > 0) {
    const data = intersects[0].object.userData;
    let text = `⭐ ${data.name}`;
    if (data.constellation) text += ` (${data.constellation})`;
    constellationInfo.textContent = text;
  }
});

function animate() {
  requestAnimationFrame(animate);
  updateSkyRotation();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

updateTimeDisplay();
detectLocation();
animate();
</script>
</body>
</html>
