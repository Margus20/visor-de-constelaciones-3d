<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cielo en Vivo - Constelaciones</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  #canvas-container {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
  }
  #ui {
    position: fixed;
    top: 10px;
    left: 10px;
    background: rgba(0, 0, 30, 0.85);
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #4a90e2;
    z-index: 10;
    max-width: 280px;
    font-size: 14px;
  }
  #ui h2 {
    font-size: 16px;
    margin-bottom: 10px;
    color: #4a90e2;
  }
  #location-status {
    background: #111;
    padding: 8px;
    border-radius: 5px;
    margin-bottom: 10px;
    font-size: 13px;
    border-left: 3px solid #4a90e2;
  }
  #location-status.loading { border-left-color: #f39c12; }
  #location-status.success { border-left-color: #2ecc71; }
  #location-status.error { border-left-color: #e74c3c; }
  button {
    background: #4a90e2;
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 5px;
    margin-top: 8px;
    cursor: pointer;
    width: 100%;
    font-size: 14px;
  }
  button:hover { background: #357abd; }
  button.equator {
    background: #2ecc71;
    font-weight: bold;
  }
  button.equator:hover { background: #27ae60; }
  button.equator.active {
    background: #f39c12;
  }
  #info {
    position: fixed;
    bottom: 10px;
    left: 10px;
    background: rgba(0, 0, 30, 0.85);
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
    z-index: 10;
    max-width: 280px;
  }
  #time-control {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #333;
  }
  #time-control label {
    font-size: 12px;
    color: #aaa;
  }
  #time-control input[type="range"] {
    width: 100%;
    margin-top: 4px;
  }
  #time-display {
    text-align: center;
    font-size: 13px;
    color: #4a90e2;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui">
  <h2>🌌 Cielo en Vivo</h2>
  
  <div id="location-status" class="loading">
    📡 Obteniendo tu ubicación...
  </div>

  <button id="btn-equator" class="equator">
    🌐 Ver TODAS las constelaciones (Ecuador)
  </button>

  <button id="btn-mylocation">
    📍 Volver a mi ubicación
  </button>

  <div id="time-control">
    <label>Hora:</label>
    <input type="range" id="time-slider" min="0" max="24" step="0.1" value="22">
    <div id="time-display">22:00</div>
    <button id="btn-now">⏱️ Hora actual</button>
  </div>
</div>

<div id="info">
  <div id="constellation-info">Toca una estrella para ver su nombre</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============ CONFIGURACIÓN 3D ============
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('canvas-container').appendChild(renderer.domElement);
camera.position.set(0, 0, 0.1);

// ============ ESTRELLAS BRILLANTES ============
const brightStars = [
  ["Sirio", 6.75, -16.72, -1.46],
  ["Canopo", 6.40, -52.70, -0.74],
  ["Arturo", 14.26, 19.18, -0.05],
  ["Vega", 18.62, 38.78, 0.03],
  ["Capella", 5.28, 46.00, 0.08],
  ["Rigel", 5.24, -8.20, 0.13],
  ["Proción", 7.65, 5.22, 0.34],
  ["Betelgeuse", 5.92, 7.41, 0.42],
  ["Achernar", 1.63, -57.24, 0.46],
  ["Hadar", 14.06, -60.37, 0.61],
  ["Altair", 19.85, 8.87, 0.77],
  ["Aldebarán", 4.60, 16.51, 0.85],
  ["Antares", 16.49, -26.43, 0.96],
  ["Espiga", 13.42, -11.16, 0.97],
  ["Pólux", 7.76, 28.03, 1.14],
  ["Fomalhaut", 22.96, -29.62, 1.16],
  ["Deneb", 20.69, 45.28, 1.25],
  ["Mimosa", 12.80, -59.69, 1.25],
  ["Regulus", 10.14, 11.97, 1.35],
  ["Adhara", 6.98, -28.97, 1.50],
  ["Shaula", 17.56, -37.10, 1.63],
  ["Castor", 7.58, 31.89, 1.58],
  ["Bellatrix", 5.42, 6.35, 1.64],
  ["Elnath", 5.03, 28.61, 1.65],
  ["Miaplacidus", 9.22, -69.72, 1.68]
];

// ============ CONSTELACIONES ============
const constellations = {
  "Orión": { stars: [5, 7, 22], lines: [[5, 7], [7, 22], [5, 22]] },
  "Cruz del Sur": { stars: [17, 9], lines: [[17, 9]] },
  "Escorpio": { stars: [12, 20], lines: [[12, 20]] },
  "Can Mayor": { stars: [0, 6, 19], lines: [[0, 6], [6, 19]] }
};

// ============ FUNCIÓN: Coordenadas celestes a 3D ============
function raDecToXYZ(raHours, decDeg, radius) {
  const ra = (raHours / 24) * Math.PI * 2;
  const dec = (decDeg / 180) * Math.PI;
  const x = radius * Math.cos(dec) * Math.cos(ra);
  const y = radius * Math.sin(dec);
  const z = -radius * Math.cos(dec) * Math.sin(ra);
  return new THREE.Vector3(x, y, z);
}

// ============ FONDO DE ESTRELLAS ============
const starGeometry = new THREE.BufferGeometry();
const starPositions = [];
for (let i = 0; i < 3000; i++) {
  const ra = Math.random() * 24;
  const dec = (Math.random() * 180) - 90;
  const pos = raDecToXYZ(ra, dec, 500);
  starPositions.push(pos.x, pos.y, pos.z);
}
starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 });
scene.add(new THREE.Points(starGeometry, starMaterial));

// ============ ESTRELLAS BRILLANTES EN 3D ============
const starMeshes = [];
brightStars.forEach((star, idx) => {
  const [name, ra, dec, mag] = star;
  const pos = raDecToXYZ(ra, dec, 500);
  const size = Math.max(2, 8 - mag * 2);
  const geometry = new THREE.SphereGeometry(size, 16, 16);
  const material = new THREE.MeshBasicMaterial({
    color: mag < 0 ? 0xaaccff : (mag < 1 ? 0xffffff : 0xffeecc)
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(pos);
  mesh.userData = { name, constellation: findConstellation(idx) };
  scene.add(mesh);
  starMeshes.push(mesh);
});

function findConstellation(starIdx) {
  for (const [name, data] of Object.entries(constellations)) {
    if (data.stars.includes(starIdx)) return name;
  }
  return null;
}

// ============ LÍNEAS DE CONSTELACIONES ============
Object.values(constellations).forEach(c => {
  c.lines.forEach(([a, b]) => {
    const posA = raDecToXYZ(brightStars[a][1], brightStars[a][2], 500);
    const posB = raDecToXYZ(brightStars[b][1], brightStars[b][2], 500);
    const geometry = new THREE.BufferGeometry().setFromPoints([posA, posB]);
    const material = new THREE.LineBasicMaterial({ color: 0x4a90e2, opacity: 0.6, transparent: true });
    scene.add(new THREE.Line(geometry, material));
  });
});

// ============ VARIABLES DE UBICACIÓN Y HORA ============
let currentLat = 0; // Empezar en ecuador por defecto
let currentLon = 0;
let currentTime = 22;
let isEquatorMode = true; // Modo ecuador activo por defecto
let userLat = null;
let userLon = null;

// ============ ELEMENTOS DEL DOM ============
const locationStatus = document.getElementById('location-status');
const btnEquator = document.getElementById('btn-equator');
const btnMyLocation = document.getElementById('btn-mylocation');
const timeSlider = document.getElementById('time-slider');
const timeDisplay = document.getElementById('time-display');
const constellationInfo = document.getElementById('constellation-info');

// ============ DETECCIÓN AUTOMÁTICA DE UBICACIÓN ============
function detectLocation() {
  locationStatus.className = 'loading';
  locationStatus.textContent = '📡 Obteniendo tu ubicación...';
  
  if (!navigator.geolocation) {
    // Si no hay soporte de geolocalización, activar modo ecuador
    activateEquatorMode('❌ Tu navegador no soporta ubicación.<br>Mostrando todas las constelaciones desde el Ecuador.');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (position) => {
      userLat = position.coords.latitude;
      userLon = position.coords.longitude;
      currentLat = userLat;
      currentLon = userLon;
      
      const latLabel = userLat >= 0 ? `${userLat.toFixed(2)}°N` : `${Math.abs(userLat).toFixed(2)}°S`;
      const lonLabel = userLon >= 0 ? `${userLon.toFixed(2)}°E` : `${Math.abs(userLon).toFixed(2)}°W`;
      
      locationStatus.className = 'success';
      locationStatus.innerHTML = `📍 <strong>Tu ubicación:</strong><br>${latLabel}, ${lonLabel}`;
      
      isEquatorMode = false;
      btnEquator.classList.remove('active');
    },
    (error) => {
      // Si rechaza el permiso o hay error, activar modo ecuador automáticamente
      let msg = '🌐 <strong>Modo Ecuador (0°)</strong><br>';
      if (error.code === 1) {
        msg += 'Permiso denegado. Viendo todas las constelaciones.';
      } else if (error.code === 2) {
        msg += 'Ubicación no disponible. Viendo todas las constelaciones.';
      } else if (error.code === 3) {
        msg += 'Tiempo de espera. Viendo todas las constelaciones.';
      }
      
      activateEquatorMode(msg);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// ============ FUNCIÓN: Activar modo ecuador ============
function activateEquatorMode(message) {
  currentLat = 0;
  currentLon = 0;
  isEquatorMode = true;
  
  locationStatus.className = 'success';
  locationStatus.innerHTML = message;
  
  btnEquator.classList.add('active');
}

// ============ BOTÓN ECUADOR ============
btnEquator.addEventListener('click', () => {
  activateEquatorMode('🌐 <strong>Modo Ecuador (0°)</strong><br>Viendo TODAS las constelaciones');
});

// ============ BOTÓN VOLVER A MI UBICACIÓN ============
btnMyLocation.addEventListener('click', () => {
  if (userLat !== null) {
    currentLat = userLat;
    currentLon = userLon;
    isEquatorMode = false;
    
    const latLabel = userLat >= 0 ? `${userLat.toFixed(2)}°N` : `${Math.abs(userLat).toFixed(2)}°S`;
    const lonLabel = userLon >= 0 ? `${userLon.toFixed(2)}°E` : `${Math.abs(userLon).toFixed(2)}°W`;
    
    locationStatus.className = 'success';
    locationStatus.innerHTML = `📍 <strong>Tu ubicación:</strong><br>${latLabel}, ${lonLabel}`;
    
    btnEquator.classList.remove('active');
  } else {
    detectLocation();
  }
});

// ============ CONTROL DE HORA ============
timeSlider.addEventListener('input', (e) => {
  currentTime = parseFloat(e.target.value);
  updateTimeDisplay();
});

document.getElementById('btn-now').addEventListener('click', () => {
  const now = new Date();
  currentTime = now.getHours() + now.getMinutes()/60;
  timeSlider.value = currentTime;
  updateTimeDisplay();
});

function updateTimeDisplay() {
  const h = Math.floor(currentTime);
  const m = Math.floor((currentTime - h) * 60);
  timeDisplay.textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
}

// ============ ROTACIÓN DEL CIELO ============
function updateSkyRotation() {
  const hourAngle = (currentTime / 24) * Math.PI * 2;
  scene.rotation.y = -hourAngle;
  scene.rotation.x = (currentLat / 180) * Math.PI;
}

// ============ INTERACTIVIDAD ============
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(starMeshes);
  if (intersects.length > 0) {
    const data = intersects[0].object.userData;
    let text = `⭐ ${data.name}`;
    if (data.constellation) text += ` (${data.constellation})`;
    constellationInfo.textContent = text;
  }
});

// ============ ANIMACIÓN ============
function animate() {
  requestAnimationFrame(animate);
  updateSkyRotation();
  renderer.render(scene, camera);
}

// ============ RESPONSIVE ============
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============ INICIO ============
updateTimeDisplay();
detectLocation(); // Detecta ubicación automáticamente al cargar
animate();
</script>
</body>
</html>
